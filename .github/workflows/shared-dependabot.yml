on:
  workflow_call:

jobs:
  dependabot:
    name: Merge PR
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Load Dependabot meta-data
        uses: dependabot/fetch-metadata@v3.1.0
        id: dependabot-metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The pre-approved dependencies are defined by the "pre-approved" groups in
      # each repository's .github/dependabot.yml, which is generated from
      # modules/repo/dependabot.tf.
      - name: Auto-merge minor/patch updates to pre-approved dependencies
        run: gh pr merge "${{ github.event.pull_request.html_url }}" --merge --auto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: >
          steps.dependabot-metadata.outputs.update-type != 'version-update:semver-major'
          && (
               steps.dependabot-metadata.outputs.dependency-group == 'pre-approved'
            || steps.dependabot-metadata.outputs.dependency-group == 'pre-approved-security'
          )
